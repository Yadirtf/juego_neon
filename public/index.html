<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Batalla Neón - Multijugador Multi-Sala TRON</title>
    <!-- Google Fonts: Orbitron & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
    <!-- Estilos Separados -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Pantalla de Lobby Multi-Sala -->
    <div id="lobbyScreen">
        <div class="lobby-container">
            <div class="cyber-header">
                <h1 class="cyber-title">BATALLA NEÓN</h1>
                <p class="cyber-subtitle">Plataforma Multijugador en Tiempo Real</p>
            </div>

            <!-- Identificación de Jugador -->
            <div class="cyber-card">
                <h2 class="card-title">👤 Tu Identificación</h2>
                <input type="text" id="aliasInput" class="cyber-input" placeholder="INGRESA TU ALIAS (Ej: Tron_01)" maxlength="12" autocomplete="off">
            </div>

            <!-- Crear o Unirse por Código -->
            <div class="cyber-card">
                <h2 class="card-title">⚡ Crear o Ingresar a una Sala</h2>
                
                <div class="input-row">
                    <input type="text" id="roomNameInput" class="cyber-input" placeholder="Nombre de tu sala (Opcional)" maxlength="20">
                    <button id="createRoomBtn" class="cyber-btn">CREAR SALA ➕</button>
                </div>

                <div class="input-row" style="margin-top: 5px;">
                    <input type="text" id="roomCodeInput" class="cyber-input" placeholder="CÓDIGO DE SALA (Ej: NEON-7X2A)" maxlength="10" autocomplete="off">
                    <button id="joinCodeBtn" class="cyber-btn cyber-btn-secondary">UNIRSE CON CÓDIGO 🔑</button>
                </div>
            </div>

            <!-- Explorador de Salas Activas (Espectadores / Duelos) -->
            <div class="cyber-card">
                <h2 class="card-title">🌐 Salas Activas Públicas</h2>
                <div id="roomsListContainer" class="rooms-grid">
                    <div class="no-rooms-msg">Cargando salas activas...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Pantalla de Juego de la Sala -->
    <div id="gameContainer">
        <div id="topBar">
            <div class="hud-row-top">
                <div class="room-header-tag">
                    <span>SALA:</span>
                    <span id="currentRoomCode" class="room-code-badge clickable-badge" title="Haz clic para copiar el código 📋">NEON-----</span>
                    <span id="currentRoomName" style="color: #94a3b8; font-weight: 400; font-size: 12px;">(--)</span>
                </div>
                <div class="hud-actions">
                    <button id="copyCodeBtn" class="cyber-btn cyber-btn-secondary" style="padding: 6px 12px; font-size: 11px;">CÓDIGO 📋</button>
                    <button id="copyLinkBtn" class="cyber-btn cyber-btn-secondary" style="padding: 6px 12px; font-size: 11px;">ENLACE 🔗</button>
                    <button id="leaveRoomBtn" class="cyber-btn cyber-btn-danger" style="padding: 6px 12px; font-size: 11px;">SALIR 🚪</button>
                </div>
            </div>

            <div class="hud-row-scores">
                <div class="score-box score-p1">
                    <span id="nameP1">P1</span>
                    <span class="score-num" id="scoreP1">0</span>
                </div>
                <div id="pingDisplay">PING: <span id="pingVal">--</span>ms</div>
                <div class="score-box score-p2">
                    <span class="score-num" id="scoreP2">0</span>
                    <span id="nameP2">P2</span>
                </div>
            </div>
        </div>

        <div id="canvasWrapper">
            <canvas id="gameCanvas" width="600" height="600"></canvas>
        </div>

        <!-- Barra de Reacciones Rápidas (Caritas) -->
        <div id="reactionBar">
            <button class="btn-emoji" data-emoji="🔥" title="Presiona 1">🔥</button>
            <button class="btn-emoji" data-emoji="😎" title="Presiona 2">😎</button>
            <button class="btn-emoji" data-emoji="💀" title="Presiona 3">💀</button>
            <button class="btn-emoji" data-emoji="⚡" title="Presiona 4">⚡</button>
            <button class="btn-emoji" data-emoji="👑" title="Presiona 5">👑</button>
            <button class="btn-emoji" data-emoji="😂" title="Presiona 6">😂</button>
        </div>

        <div id="msg">ESPERANDO AL RIVAL...</div>

        <!-- Controles D-Pad para Pantallas Táctiles -->
        <div id="mobileControls">
            <div class="btn-dir" id="btnUp">▲</div>
            <div class="btn-dir" id="btnLeft">◀</div>
            <div class="btn-dir" id="btnDown">▼</div>
            <div class="btn-dir" id="btnRight">▶</div>
        </div>
    </div>

    <!-- Popup Toast -->
    <div id="toast">¡Código copiado al portapapeles! 📋</div>

    <!-- Scripts -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="game.js" defer></script>
</body>

</html>
