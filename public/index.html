<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON ARCADE - Plataforma Multijugador de Juegos Neón</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="platform.css">
</head>

<body>

    <div class="hub-container">
        <!-- Header Principal -->
        <header class="hub-header">
            <div class="hub-badge">⚡ PLATAFORMA EN TIEMPO REAL</div>
            <h1 class="hub-title">NEON ARCADE</h1>
            <p class="hub-subtitle">Selecciona tu juego y compite con amigos o bots en salas optimizadas</p>
        </header>

        <!-- Stats Rápidas -->
        <div class="hub-stats-row">
            <div class="stat-card">
                <span class="stat-icon">🎮</span>
                <div class="stat-info">
                    <span class="stat-value" id="totalGamesVal">2</span>
                    <span class="stat-label">Juegos Disponibles</span>
                </div>
            </div>
            <div class="stat-card">
                <span class="stat-icon">🟢</span>
                <div class="stat-info">
                    <span class="stat-value" id="statusVal">OPERATIVO</span>
                    <span class="stat-label">Estado Servidor</span>
                </div>
            </div>
            <div class="stat-card">
                <span class="stat-icon">👥</span>
                <div class="stat-info">
                    <span class="stat-value" id="activePlayersVal">Multisala</span>
                    <span class="stat-label">Salas Privadas y Públicas</span>
                </div>
            </div>
        </div>

        <!-- Catálogo de Juegos -->
        <section class="games-section">
            <h2 class="section-title">🕹️ Catálogo de Juegos</h2>

            <div id="gamesGrid" class="games-grid">
                <!-- Se llena dinámicamente desde platform.js leyendo /api/games -->
            </div>
        </section>

        <!-- Footer -->
        <footer class="hub-footer">
            <p>NEON ARCADE &copy; 2026 — Diseñado con arquitectura modular escalable.</p>
        </footer>
    </div>

    <script src="platform.js" defer></script>
</body>

</html>
